[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkml-architecture-search"
version = "0.1.0"
description = "Proof-cost-aware neural architecture search for zero-knowledge transformer inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=2.0.2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "onnx>=1.14",
    "transformers>=4.40",
    "datasets>=3.0",
    "tiktoken>=0.7",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
ezkl = ["ezkl>=23.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["proxy*", "search*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
